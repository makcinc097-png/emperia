<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b45">
<title>Империя — Мой город</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:#071522;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(100vw,100vh);height:min(100vw,100vh);max-width:100vw;max-height:100vh}
#city{display:block;width:100%;height:100%;object-fit:contain}
.hotspot{position:absolute;border:2px solid transparent;border-radius:18px;background:rgba(255,210,70,0);cursor:pointer;touch-action:manipulation}
.hotspot:active,.hotspot:focus{outline:2px solid #ffd45a;background:rgba(255,210,70,.18)}
/* Координаты заданы в процентах от исходного изображения 1254x1254 */
#farm{left:7%;top:48%;width:23%;height:13%}
#sawmill{left:32%;top:54%;width:23%;height:13%}
#quarry{left:73%;top:59%;width:19%;height:13%}
#house{left:66%;top:44%;width:18%;height:14%}
#barracks{left:39%;top:23%;width:27%;height:23%}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px;z-index:5}
.panel{width:min(360px,100%);background:linear-gradient(#234e70,#10263a);border:2px solid #d9a83c;border-radius:16px;padding:18px;box-shadow:0 8px 28px #000}
h2{margin:0 0 12px;color:#ffd45a}.muted{color:#d6e3ef;line-height:1.45}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:1px solid #f4c65b;border-radius:10px;padding:12px;background:#174d79;color:white;font-weight:bold;font-size:16px}
#close{background:#394b5b;border-color:#9eacb8}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:6px 10px;background:#071522b8;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <img id="city" src="city_3d.png" alt="Город Империи">
  <button class="hotspot" id="farm" aria-label="Ферма" data-building="farm"></button>
  <button class="hotspot" id="sawmill" aria-label="Лесопилка" data-building="sawmill"></button>
  <button class="hotspot" id="quarry" aria-label="Каменоломня" data-building="quarry"></button>
  <button class="hotspot" id="house" aria-label="Жилой дом" data-building="house"></button>
  <button class="hotspot" id="barracks" aria-label="Казармы" data-building="barracks"></button>
  <div class="hint">Нажми на здание города</div>
</div>
<div id="modal">
 <div class="panel">
  <h2 id="title">Здание</h2>
  <div class="muted" id="description">Выбери действие.</div>
  <div class="actions">
   <button id="close">Назад</button>
   <button id="upgrade">Улучшить</button>
  </div>
 </div>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor("#102b45");tg.setBackgroundColor("#071522")}
const info={
 farm:["🌾 Ферма","Производит еду. Здесь можно открыть управление фермой."],
 sawmill:["🪓 Лесопилка","Производит дерево. Здесь можно открыть управление лесопилкой."],
 quarry:["⛏ Каменоломня","Добывает камень. Здесь можно открыть управление каменоломней."],
 house:["🏠 Жилой дом","Увеличивает вместимость населения."],
 barracks:["🏰 Казармы","Здесь готовят войска для защиты и сражений."]
};
let selected=null;
const modal=document.getElementById("modal");
document.querySelectorAll(".hotspot").forEach(btn=>btn.addEventListener("click",()=>{
 selected=btn.dataset.building;
 document.getElementById("title").textContent=info[selected][0];
 document.getElementById("description").textContent=info[selected][1];
 modal.style.display="flex";
}));
document.getElementById("close").onclick=()=>modal.style.display="none";
document.getElementById("upgrade").onclick=()=>{
 if(!selected)return;
 const payload=JSON.stringify({action:"city_building",building:selected});
 if(tg){tg.sendData(payload);modal.style.display="none"}
 else {document.getElementById("description").textContent="Открой эту страницу внутри Telegram, чтобы отправить действие боту."}
};
modal.addEventListener("click",e=>{if(e.target===modal)modal.style.display="none"});
</script>
</body>
</html>
